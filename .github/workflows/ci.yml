# Runs the §9.5 step 4 gate — make build && make test && make lint — on every
# pull request to main, so the rule holds without an agent's cooperation, plus
# a formatting check that holds D-013's other half.
# Design and the measurements behind it:
#   docs/superpowers/specs/2026-09-04-m1-07-ci-workflow-design.md
name: CI

on:
  pull_request:
    branches: [main]

# No `paths:` filter, deliberately. A paths-filtered workflow does not run on a
# PR that touches nothing matching, and a *required* check that never reports
# leaves the PR stuck on "Expected — waiting for status to be reported". With
# enforce_admins on, that cannot be self-overridden. A doc-only PR would become
# unmergeable to save a few runner minutes.

# Block style, not flow style: `${{ … }}` is built from `{`, `}` and spaces,
# which are indicators inside a YAML flow mapping. The one-line form
# `concurrency: { group: ci-${{ github.ref }} }` is a hard parse error.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # This job id is the check-run name, and it is what branch protection's
  # required_status_checks matches on, verbatim. Keep it a plain identifier;
  # adding a `name:` here renames the check and silently breaks that match.
  # A skipped job is a subtler way to disarm the same gate: GitHub reports a
  # skipped job as success on the required check, so an `if:` condition or a
  # `paths:` filter added later would make this check pass green without
  # building anything — and with required approvals at 0, a human reading the
  # diff is the only defence. This repo has a documented history of gates
  # that pass while checking nothing (D-008, D-014).
  build-test-lint:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      # Defined once so the build and test invocations cannot drift apart.
      # Ad-hoc rather than CODE_SIGNING_ALLOWED=NO: this way the codesign step
      # actually runs against the app, the embedded StenoKit framework and the
      # test bundle, so a broken Steno.entitlements or an embedding regression
      # fails here instead of reaching main.
      SIGN: CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual
    steps:
      - uses: actions/checkout@v7

      # One line, and it puts the toolchain in every log. When CI and local
      # disagree this is the first thing anyone needs and the most annoying
      # thing to obtain after the fact.
      - name: Toolchain version
        run: xcodebuild -version

      # Local.xcconfig is gitignored (§9.3) and holds a Personal Team ID no
      # runner has. It cannot simply be absent: xcodegen refuses to generate
      # without it ("Invalid config file"), and `make preflight` requires a
      # non-empty DEVELOPMENT_TEAM. The team below is never resolved — SIGN
      # selects CODE_SIGN_STYLE=Manual, which performs no profile lookup and so
      # makes no Apple ID round-trip.
      # Do not run this line locally: it overwrites your real Local.xcconfig.
      - name: Write CI signing stub
        run: printf '// Generated by CI. Not a real team.\nDEVELOPMENT_TEAM = CI0000000\n' > Local.xcconfig

      - name: make bootstrap
        run: make bootstrap

      - name: make build
        run: make build XCFLAGS="$SIGN"

      # Runs headless with outbound networking denied by Scripts/test-sandbox.sb
      # (§9.4, D-012). Needs no credentials, which is why this workflow needs no
      # secrets.
      - name: make test
        run: make test XCFLAGS="$SIGN"

      # Runs even when build or test failed. SwiftLint parses source rather than
      # compiling it, so it is independent of both and still yields a valid
      # signal when they are red — one run then reports every problem instead of
      # surfacing them one push at a time. That is not hypothetical: during
      # M1-07's own verification a test failure masked an intended lint failure
      # and cost a rerun to confirm. Raised by Copilot on PR #18.
      #
      # `!cancelled()` rather than `always()`, so a run stopped by the
      # concurrency group or the job timeout ends here instead of burning a
      # runner on a result nobody will read. The quotes are required: a bare `!`
      # opens a YAML tag.
      #
      # `make build` and `make test` are deliberately NOT given this treatment.
      # A test run after a failed build only reproduces the same compile error,
      # so it adds no signal and doubles the time to a red result.
      - name: make lint
        if: '!cancelled()'
        run: make lint

      # D-013 splits the contract: SwiftLint owns semantics and naming, and
      # swift-format owns layout. Only the first half was enforced, so a file
      # could merge unformatted and stay that way — the next author to run
      # `make format` as §9.5 step 4 requires would find an unrelated file in
      # their working tree and have to notice and drop it. That is not
      # hypothetical: EventQueriesTests.swift drifted at M1-06 and was
      # rediscovered twice during M2-02 (#23).
      #
      # `make format` writes in place, so "is it formatted" is expressed as
      # "does formatting change anything". That makes this step mutate the
      # checkout, which is why it runs **last** — nothing downstream may see a
      # tree that no commit corresponds to.
      #
      # `!cancelled()` for `make lint`'s reason: formatting is independent of
      # compiling, so a red build must not hide it, and one run should report
      # every problem rather than surfacing them one push at a time.
      #
      # Needs no signing stub and no generated project: `make format` shells
      # out to `xcrun swift-format` and has no `preflight` dependency. It is
      # placed here for the mutation argument above, not because it needs the
      # setup steps.
      #
      # The diff is scoped to the three directories `make format` writes to —
      # the same list the target and .swiftlint.yml carry — so this reports what
      # the formatter did and cannot be tripped by another step dirtying the
      # tree. Both `Steno.xcodeproj` and `Local.xcconfig` are gitignored today,
      # which makes the scope belt-and-braces rather than load-bearing; it costs
      # nothing and removes a way for this check to fail for a reason it does
      # not name.
      - name: make format is a no-op
        if: '!cancelled()'
        run: |
          make format
          git diff --exit-code -- Steno StenoKit StenoTests || {
            echo "::error::swift-format would rewrite the files diffed above. Run 'make format' locally and commit the result."
            exit 1
          }
