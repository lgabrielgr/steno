# XcodeGen manifest — the source of truth for the Xcode project.
# The .xcodeproj is generated by `make generate` and is gitignored (§9.1).
# Fixed facts below are taken verbatim from REQUIREMENTS.md §9.1.
name: Steno

options:
  bundleIdPrefix: com.lgabrielgr
  deploymentTarget:
    macOS: "14.0"          # SwiftData floor (D2)
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

# Project level, not target level: M0-02's test bundle needs signing too and
# inherits from here, and the Xcode GUI picks this up where `xcodebuild
# -xcconfig` would not (§9.3).
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: Apple Development   # never ad-hoc "-" locally (§9.3); CI overrides on the command line — see D-053
    ENABLE_HARDENED_RUNTIME: NO             # not notarizing (§6.1)
    SWIFT_VERSION: "6.0"

targets:
  # Everything testable lives here, not in the app target. A macOS unit-test
  # bundle that runs headless (§9.4) cannot be hosted by an app — the host
  # would launch NSApplication and need a window server — and an unhosted
  # bundle cannot link an application target. A framework is what both the app
  # and the tests can link. See DECISIONS.md D-010.
  StenoKit:
    type: framework
    platform: macOS
    sources:
      - path: StenoKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lgabrielgr.steno.kit
        PRODUCT_NAME: StenoKit
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  Steno:
    type: application
    platform: macOS
    sources:
      - path: Steno
        # Entitlements are referenced by build setting; without this exclude
        # XcodeGen would also copy the file into the bundle as a resource.
        excludes:
          - "**/*.entitlements"
    dependencies:
      - target: StenoKit
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lgabrielgr.steno
        PRODUCT_NAME: Steno
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        CODE_SIGN_ENTITLEMENTS: Steno/Steno.entitlements
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"

  # No TEST_HOST, deliberately: an unhosted bundle runs under the xctest
  # runner with no NSApplication and no window server, which is what §9.4's
  # headless requirement asks for (D-010). Do not add a host app. Running the
  # suite over SSH needs more than the bundle — see README's caveat.
  StenoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: StenoTests
    dependencies:
      - target: StenoKit
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lgabrielgr.steno.tests
        GENERATE_INFOPLIST_FILE: YES
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@loader_path/../Frameworks"

# Declared explicitly, not left to Xcode's autocreate: `xcodebuild -scheme`
# needs a *shared* scheme on disk, and an autocreated one lands in xcuserdata/,
# which is gitignored — a clean checkout would fail in exactly the way this
# task exists to prevent.
schemes:
  Steno:
    build:
      targets:
        Steno: all
        StenoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StenoTests
