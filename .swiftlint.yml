# The lint contract for every PR after M0-02 (REQUIREMENTS.md §9.5 step 4).
#
# Division of labor: swift-format owns layout, SwiftLint owns semantics and
# naming. Both tools have opinions about whitespace, and if both are
# authoritative the failure mode is an agent running `make format`, seeing a
# clean diff, and still failing `make lint` with no indication which tool to
# believe. See DECISIONS.md D-013.

# Hand-kept in sync with the directory list in the Makefile's `format` target.
# Drift here is quiet: swiftlint only complains when *every* entry is stale, so
# a new top-level source directory that reaches one list and not the other is
# silently unlinted or unformatted.
included:
  - Steno
  - StenoKit
  - StenoTests

excluded:
  - .build

# swift-format's territory — see .swift-format
disabled_rules:
  - line_length
  - trailing_whitespace
  - vertical_whitespace
  # swift-format inserts a trailing comma on every multi-line collection
  # literal it reformats (respectsExistingLineBreaks keeps the breaks; it adds
  # the comma regardless). Left enabled, this rule reproduces the exact loop
  # D-013 exists to prevent: `make format` reintroduces the comma that
  # `make lint --strict` then rejects. Found in M0-03 (SourceRefTests.swift).
  - trailing_comma
  # Pure layout, which D-013 assigns to swift-format, not to SwiftLint. Its
  # only observed effect in this repo was rejecting swift-format's own output:
  # the formatter breaks a multi-clause `if let` or a long generic signature
  # across lines and this rule then fails the build, forcing correct code to be
  # restructured by hand (M0-05's files, commit 43f563d). Nothing is lost by
  # dropping it — `make format` normalises a hand-written misplaced brace
  # anyway. See D-023.
  - opening_brace

# Deliberately modest. Rules are cheap to add later against real code and
# expensive to remove once 34 tasks have been written under them.
opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - force_unwrapping

# M5-01's fourth acceptance criterion as a check rather than a promise (D-242):
# MCP is stdio only in v1 (REQUIREMENTS.md §5.1, §5.4). A network transport in
# the MCP directory fails `make lint`, so adding one has to be a visible edit to
# this file — which is where §5.4's "add HTTP/SSE only if a required server
# offers no local option" decision belongs.
#
# `match_kinds` restricts the match to code: a doc comment explaining why there
# is no URLSession here must not trip the rule that enforces it.
custom_rules:
  mcp_stdio_only:
    name: "MCP is stdio only"
    included: "StenoKit/Integrations/MCP/"
    regex: "\\b(URLSession|URLRequest|NWConnection|NWListener|EventSource)\\b"
    match_kinds:
      - identifier
      - typeidentifier
    message: "MCP is stdio only in v1 (REQUIREMENTS.md §5.1, §5.4, D-242)"
    severity: error
